<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>산단 뉴스 모니터</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --text: #1d2330; --muted: #6b7280;
    --line: #e4e7ec; --accent: #2563eb; --accent-soft: #e8efff; --new: #e11d48;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12151b; --card: #1b1f27; --text: #e6e8ec; --muted: #9aa3b2;
      --line: #2b313c; --accent: #6b9bff; --accent-soft: #1f2b45; --new: #fb7185;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
    line-height: 1.5;
  }
  .wrap { max-width: 880px; margin: 0 auto; padding: 20px 16px 60px; }
  header h1 { margin: 0 0 4px; font-size: 1.5rem; }
  header p { margin: 0; color: var(--muted); font-size: .9rem; }
  .controls {
    position: sticky; top: 0; z-index: 1; background: var(--bg);
    padding: 14px 0 10px; border-bottom: 1px solid var(--line); margin-bottom: 8px;
  }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
  .chip {
    border: 1px solid var(--line); background: var(--card); color: var(--text);
    border-radius: 999px; padding: 5px 12px; font-size: .88rem; cursor: pointer;
  }
  .chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
  .chip .n { opacity: .7; margin-left: 4px; font-size: .8rem; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; }
  .row input, .row select {
    font: inherit; padding: 7px 10px; border-radius: 8px;
    border: 1px solid var(--line); background: var(--card); color: var(--text);
  }
  .row input { flex: 1; min-width: 160px; }
  .stats { color: var(--muted); font-size: .85rem; margin-top: 8px; display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
  .stats button { background: none; border: none; color: var(--accent); cursor: pointer; font: inherit; padding: 0; }
  h2.day { font-size: .95rem; color: var(--muted); margin: 22px 0 8px; font-weight: 600; }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    padding: 12px 14px; margin-bottom: 8px;
  }
  .card a.title { color: var(--text); text-decoration: none; font-weight: 600; font-size: 1rem; }
  .card a.title:hover { color: var(--accent); text-decoration: underline; }
  .card.read a.title { color: var(--muted); font-weight: 500; }
  .meta { color: var(--muted); font-size: .82rem; margin-top: 4px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .tag { background: var(--accent-soft); color: var(--accent); border-radius: 6px; padding: 1px 7px; font-size: .78rem; }
  .badge-new { color: #fff; background: var(--new); border-radius: 6px; padding: 0 6px; font-size: .72rem; font-weight: 700; margin-right: 6px; vertical-align: 2px; }
  .summary { margin: 6px 0 0; font-size: .88rem; color: var(--muted); }
  .empty { text-align: center; color: var(--muted); padding: 50px 0; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>산단 뉴스 모니터</h1>
    <p id="updated">불러오는 중…</p>
  </header>

  <div class="controls">
    <div class="chips" id="chips"></div>
    <div class="row">
      <input id="q" type="search" placeholder="제목·언론사 검색">
      <select id="period">
        <option value="1">오늘</option>
        <option value="3">최근 3일</option>
        <option value="7" selected>최근 7일</option>
        <option value="30">최근 30일</option>
        <option value="0">전체</option>
      </select>
      <select id="unread">
        <option value="all">모두 보기</option>
        <option value="unread">안 읽은 기사만</option>
      </select>
    </div>
    <div class="stats"><span id="count"></span><button id="markAll" type="button">모두 읽음 표시</button></div>
  </div>

  <main id="list"></main>
</div>

<script>
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};

const state = {
  data: null,
  selected: new Set(),            // 비어 있으면 전체 키워드
  read: new Set(store.get("read", [])),
  lastVisit: store.get("lastVisit", null),
};

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

const kstDay = (iso) => new Date(iso).toLocaleDateString("ko-KR", { timeZone: "Asia/Seoul", year: "numeric", month: "long", day: "numeric", weekday: "short" });
const kstTime = (iso) => new Date(iso).toLocaleTimeString("ko-KR", { timeZone: "Asia/Seoul", hour: "2-digit", minute: "2-digit" });
const kstDateKey = (d) => d.toLocaleDateString("sv-SE", { timeZone: "Asia/Seoul" });

function articleDate(a) { return a.published || a.collected; }

function isNew(a) {
  return state.lastVisit && a.collected > state.lastVisit && !state.read.has(a.id);
}

function filtered() {
  const q = $("q").value.trim().toLowerCase();
  const days = Number($("period").value);
  const unreadOnly = $("unread").value === "unread";
  let minKey = null;
  if (days > 0) {
    const d = new Date(Date.now() - (days - 1) * 86400000);
    minKey = kstDateKey(d);
  }
  return state.data.articles.filter((a) => {
    if (state.selected.size && !a.keywords.some((k) => state.selected.has(k))) return false;
    if (minKey && kstDateKey(new Date(articleDate(a))) < minKey) return false;
    if (unreadOnly && state.read.has(a.id)) return false;
    if (q && !(`${a.title} ${a.source} ${a.summary}`.toLowerCase().includes(q))) return false;
    return true;
  });
}

function renderChips() {
  const counts = {};
  for (const a of state.data.articles) for (const k of a.keywords) counts[k] = (counts[k] || 0) + 1;
  const all = `<button class="chip" data-k="" aria-pressed="${state.selected.size === 0}">전체<span class="n">${state.data.articles.length}</span></button>`;
  $("chips").innerHTML = all + state.data.keywords.map((k) =>
    `<button class="chip" data-k="${esc(k)}" aria-pressed="${state.selected.has(k)}">${esc(k)}<span class="n">${counts[k] || 0}</span></button>`
  ).join("");
}

function render() {
  const items = filtered();
  $("count").textContent = `${items.length}건 표시` + (state.lastVisit ? ` · 새 기사 ${items.filter(isNew).length}건` : "");
  if (!items.length) {
    $("list").innerHTML = `<div class="empty">조건에 맞는 기사가 없습니다.</div>`;
    return;
  }
  let html = "", lastDay = "";
  for (const a of items) {
    const day = kstDay(articleDate(a));
    if (day !== lastDay) { html += `<h2 class="day">${day}</h2>`; lastDay = day; }
    html += `
      <article class="card ${state.read.has(a.id) ? "read" : ""}">
        ${isNew(a) ? '<span class="badge-new">NEW</span>' : ""}
        <a class="title" href="${esc(a.link)}" target="_blank" rel="noopener" data-id="${esc(a.id)}">${esc(a.title)}</a>
        ${a.summary ? `<p class="summary">${esc(a.summary)}</p>` : ""}
        <div class="meta">
          <span>${esc(a.source || "출처 미상")}</span>
          ${a.published ? `<span>· ${kstTime(a.published)}</span>` : ""}
          ${a.keywords.map((k) => `<span class="tag">${esc(k)}</span>`).join("")}
        </div>
      </article>`;
  }
  $("list").innerHTML = html;
}

function markRead(id) {
  state.read.add(id);
  // 오래된 기록은 정리 (현재 데이터에 있는 기사만 유지)
  const ids = new Set(state.data.articles.map((a) => a.id));
  store.set("read", [...state.read].filter((x) => ids.has(x)));
}

$("chips").addEventListener("click", (e) => {
  const btn = e.target.closest(".chip");
  if (!btn) return;
  const k = btn.dataset.k;
  if (!k) state.selected.clear();
  else state.selected.has(k) ? state.selected.delete(k) : state.selected.add(k);
  renderChips(); render();
});
$("list").addEventListener("click", (e) => {
  const a = e.target.closest("a.title");
  if (!a) return;
  markRead(a.dataset.id);
  a.closest(".card").classList.add("read");
  a.closest(".card").querySelector(".badge-new")?.remove();
});
$("list").addEventListener("auxclick", (e) => {
  const a = e.target.closest("a.title");
  if (a) { markRead(a.dataset.id); a.closest(".card").classList.add("read"); }
});
["q", "period", "unread"].forEach((id) => $(id).addEventListener("input", render));
$("markAll").addEventListener("click", () => {
  filtered().forEach((a) => state.read.add(a.id));
  markRead("");
  render();
});

fetch(`news.json?t=${Date.now()}`)
  .then((r) => r.json())
  .then((data) => {
    state.data = data;
    $("updated").textContent = data.updated
      ? `마지막 업데이트: ${kstDay(data.updated)} ${kstTime(data.updated)} (매일 07시·12시·18시 자동 수집)`
      : "아직 수집된 데이터가 없습니다. GitHub Actions에서 '뉴스 수집'을 실행해 주세요.";
    if (!data.keywords.length) data.keywords = [...new Set(data.articles.flatMap((a) => a.keywords))];
    renderChips(); render();
    // 이번 방문 시각 저장 → 다음 방문 때 그 이후 수집된 기사에 NEW 표시
    if (data.updated) store.set("lastVisit", data.updated);
  })
  .catch(() => { $("updated").textContent = "뉴스 데이터를 불러오지 못했습니다."; });
</script>
</body>
</html>
