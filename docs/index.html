<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>산업단지 뉴스 모니터</title>
<meta name="description" content="온산·여수 국가산업단지와 울산 사업장폐기물 관련 뉴스를 매일 자동으로 모아 보여줍니다.">
<meta property="og:title" content="산업단지 뉴스 모니터">
<meta property="og:description" content="온산·여수 국가산업단지 관련 뉴스를 매일 자동 수집">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231e4fd8'/%3E%3Cpath d='M7 23V13l5 3v-3l5 3v-3l5 3V9h3v14z' fill='white'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f4f6fa;
    --surface: #ffffff;
    --surface-2: #f8f9fc;
    --text: #141a26;
    --text-2: #4a5468;
    --muted: #8a93a6;
    --line: #e3e7ef;
    --brand: #1e4fd8;
    --brand-soft: #e9efff;
    --on-brand: #ffffff;
    --g0: #1e4fd8; --g0-soft: #e9efff;   /* 울산·온산 */
    --g1: #0e8a6a; --g1-soft: #e3f5ef;   /* 여수 */
    --new: #e5484d;
    --shadow: 0 1px 2px rgba(20, 26, 38, .04), 0 2px 8px rgba(20, 26, 38, .04);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f1218; --surface: #171b23; --surface-2: #1c212b;
      --text: #e8ebf1; --text-2: #b4bccb; --muted: #7d8699; --line: #272d38;
      --brand: #7ea2ff; --brand-soft: #1d2740; --on-brand: #0f1218;
      --g0: #7ea2ff; --g0-soft: #1d2740; --g1: #4fd1a5; --g1-soft: #15302a;
      --new: #ff6b70; --shadow: none;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0f1218; --surface: #171b23; --surface-2: #1c212b;
    --text: #e8ebf1; --text-2: #b4bccb; --muted: #7d8699; --line: #272d38;
    --brand: #7ea2ff; --brand-soft: #1d2740; --on-brand: #0f1218;
    --g0: #7ea2ff; --g0-soft: #1d2740; --g1: #4fd1a5; --g1-soft: #15302a;
    --new: #ff6b70; --shadow: none;
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: "Noto Sans KR", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    font-size: 15px; line-height: 1.55; word-break: keep-all; overflow-wrap: anywhere;
  }
  button, input, select { font: inherit; color: inherit; }
  .wrap { max-width: 960px; margin: 0 auto; padding: 0 16px; }

  /* 상단 바 */
  .topbar { background: var(--surface); border-bottom: 1px solid var(--line); }
  .topbar .wrap { display: flex; align-items: center; justify-content: space-between; gap: 12px; height: 60px; }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 1.05rem; letter-spacing: -.01em; }
  .brand svg { flex: none; }
  .btn {
    display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 14px;
    border-radius: 8px; border: 1px solid var(--line); background: var(--surface);
    cursor: pointer; font-size: .88rem; font-weight: 500; white-space: nowrap;
  }
  .btn:hover { border-color: var(--brand); color: var(--brand); }
  .btn.primary { background: var(--brand); border-color: var(--brand); color: var(--on-brand); }
  .btn.primary:hover { filter: brightness(1.08); color: var(--on-brand); }

  /* 헤더 */
  .hero { padding: 28px 0 8px; }
  .hero h1 { margin: 0 0 6px; font-size: 1.6rem; letter-spacing: -.02em; }
  .hero p { margin: 0; color: var(--text-2); }
  .update { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 6px 16px; color: var(--muted); font-size: .85rem; }
  .update b { color: var(--text-2); font-weight: 500; }
  .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: #22c55e; margin-right: 6px; vertical-align: 1px; }

  /* 요약 수치 */
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin: 20px 0 8px; }
  .stat { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; box-shadow: var(--shadow); }
  .stat .label { color: var(--muted); font-size: .8rem; }
  .stat .value { font-size: 1.6rem; font-weight: 700; letter-spacing: -.02em; margin-top: 2px; font-variant-numeric: tabular-nums; }
  .stat .value small { font-size: .85rem; font-weight: 500; color: var(--muted); margin-left: 2px; }
  .stat.accent .value { color: var(--new); }

  /* 필터 */
  .filters {
    position: sticky; top: 0; z-index: 5; background: var(--bg);
    padding: 12px 0; margin-top: 12px; border-bottom: 1px solid var(--line);
  }
  .seg { display: inline-flex; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 3px; gap: 2px; }
  .seg button {
    border: 0; background: none; padding: 6px 14px; border-radius: 7px; cursor: pointer;
    font-size: .9rem; color: var(--text-2); font-weight: 500; white-space: nowrap;
  }
  .seg button[aria-pressed="true"] { background: var(--brand); color: var(--on-brand); }
  .filter-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .filter-row + .filter-row { margin-top: 10px; }
  .search { flex: 1; min-width: 180px; position: relative; }
  .search input {
    width: 100%; height: 38px; padding: 0 12px 0 36px; border-radius: 10px;
    border: 1px solid var(--line); background: var(--surface);
  }
  .search svg { position: absolute; left: 11px; top: 11px; color: var(--muted); }
  select {
    height: 38px; padding: 0 10px; border-radius: 10px; border: 1px solid var(--line);
    background: var(--surface); cursor: pointer;
  }
  input:focus, select:focus, button:focus-visible { outline: 2px solid var(--brand); outline-offset: 1px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    border: 1px solid var(--line); background: var(--surface); border-radius: 999px;
    padding: 4px 12px; font-size: .84rem; cursor: pointer; color: var(--text-2);
  }
  .chip .n { color: var(--muted); margin-left: 4px; font-variant-numeric: tabular-nums; }
  .chip[aria-pressed="true"] { border-color: var(--c, var(--brand)); background: var(--c-soft, var(--brand-soft)); color: var(--c, var(--brand)); font-weight: 500; }
  .chip[aria-pressed="true"] .n { color: inherit; opacity: .75; }
  .result-bar { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: 10px; color: var(--muted); font-size: .84rem; }
  .linkbtn { background: none; border: 0; color: var(--brand); cursor: pointer; padding: 0; font-size: .84rem; }

  /* 기사 목록 */
  .day { display: flex; align-items: baseline; gap: 8px; margin: 26px 0 10px; }
  .day h2 { margin: 0; font-size: .95rem; font-weight: 700; }
  .day span { color: var(--muted); font-size: .82rem; }
  .list { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; box-shadow: var(--shadow); }
  .item { display: block; padding: 14px 18px; border-top: 1px solid var(--line); text-decoration: none; color: inherit; }
  .item:first-child { border-top: 0; }
  .item:hover { background: var(--surface-2); }
  .item .title { font-weight: 500; font-size: 1rem; line-height: 1.5; }
  .item:hover .title { color: var(--brand); }
  .item.read .title { color: var(--muted); font-weight: 400; }
  .item .summary { margin: 4px 0 0; color: var(--text-2); font-size: .88rem; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 6px; font-size: .8rem; color: var(--muted); }
  .meta .src { color: var(--text-2); font-weight: 500; }
  .tag { border-radius: 6px; padding: 1px 8px; font-size: .75rem; font-weight: 500; background: var(--c-soft); color: var(--c); }
  .new { display: inline-block; font-size: .68rem; font-weight: 700; color: #fff; background: var(--new); border-radius: 4px; padding: 0 5px; margin-right: 6px; vertical-align: 2px; letter-spacing: .02em; }

  .empty { text-align: center; color: var(--muted); padding: 60px 16px; background: var(--surface); border: 1px dashed var(--line); border-radius: 14px; margin-top: 20px; }
  footer { color: var(--muted); font-size: .8rem; padding: 40px 0 48px; text-align: center; line-height: 1.8; }
  footer a { color: inherit; }

  .toast {
    position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 20px); opacity: 0;
    background: #141a26; color: #fff; padding: 10px 16px; border-radius: 10px; font-size: .88rem;
    transition: .2s; pointer-events: none; z-index: 10;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  @media (max-width: 720px) {
    .stats { grid-template-columns: repeat(2, 1fr); }
    .hero h1 { font-size: 1.35rem; }
    .item { padding: 13px 14px; }
    .btn .label-long { display: none; }
  }
</style>
</head>
<body>
<div class="topbar">
  <div class="wrap">
    <div class="brand">
      <svg width="28" height="28" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="#1e4fd8"/><path d="M7 23V13l5 3v-3l5 3v-3l5 3V9h3v14z" fill="#fff"/></svg>
      산업단지 뉴스 모니터
    </div>
    <button class="btn primary" id="share" type="button">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/></svg>
      <span>링크 복사<span class="label-long"> · 팀원에게 공유</span></span>
    </button>
  </div>
</div>

<div class="wrap">
  <section class="hero">
    <h1>오늘의 산업단지 뉴스</h1>
    <p id="intro">온산·여수 국가산업단지와 울산 사업장폐기물 관련 뉴스를 매일 자동으로 모읍니다.</p>
    <div class="update">
      <span><span class="dot"></span>마지막 업데이트 <b id="updated">불러오는 중…</b></span>
      <span>다음 업데이트 <b id="next">-</b></span>
    </div>
  </section>

  <section class="stats" id="stats" aria-label="요약"></section>

  <section class="filters" aria-label="필터">
    <div class="filter-row">
      <div class="seg" id="groups" role="group" aria-label="지역"></div>
      <div class="search">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="제목·언론사 검색" aria-label="검색">
      </div>
      <select id="period" aria-label="기간">
        <option value="1">오늘</option>
        <option value="3">최근 3일</option>
        <option value="7" selected>최근 7일</option>
        <option value="30">최근 30일</option>
        <option value="0">전체 기간</option>
      </select>
    </div>
    <div class="filter-row chips" id="chips"></div>
    <div class="result-bar">
      <span id="count"></span>
      <span>
        <label><input type="checkbox" id="unread"> 안 읽은 기사만</label>
        &nbsp;·&nbsp;
        <button class="linkbtn" id="markAll" type="button">모두 읽음</button>
      </span>
    </div>
  </section>

  <main id="list"></main>

  <footer>
    매일 07:05 · 12:05 · 18:05(한국시간)에 Google 뉴스에서 자동 수집합니다.<br>
    읽음·NEW 표시는 각자의 브라우저에만 저장됩니다.<br>
    <a href="https://github.com/inhangim093-max/newsmonitor" target="_blank" rel="noopener">키워드 추가·변경 (GitHub)</a>
  </footer>
</div>

<div class="toast" id="toast" role="status"></div>

<script>
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

const TZ = "Asia/Seoul";
const SCHEDULE = [[7, 5], [12, 5], [18, 5]]; // 수집 시각 (KST)
const dateKey = (d) => new Date(d).toLocaleDateString("sv-SE", { timeZone: TZ });
const fmtDay = (d) => new Date(d).toLocaleDateString("ko-KR", { timeZone: TZ, month: "long", day: "numeric", weekday: "short" });
const fmtTime = (d) => new Date(d).toLocaleTimeString("ko-KR", { timeZone: TZ, hour: "2-digit", minute: "2-digit", hour12: false });
const daysAgoKey = (n) => dateKey(Date.now() - n * 86400000);

const state = {
  data: null,
  group: store.get("group", "all"),
  keywords: new Set(),
  read: new Set(store.get("read", [])),
  lastVisit: store.get("lastVisit", null),
  kwGroup: {},           // 키워드 → 그룹 번호
};

const artDate = (a) => a.published || a.collected;
const isNew = (a) => state.lastVisit && a.collected > state.lastVisit && !state.read.has(a.id);
const groupOf = (a) => state.kwGroup[a.keywords[0]] ?? 0;
const colorVars = (gi) => `--c:var(--g${gi % 2});--c-soft:var(--g${gi % 2}-soft)`;

function nextUpdateText() {
  const now = new Date();
  const kst = new Date(now.toLocaleString("en-US", { timeZone: TZ }));
  for (const [h, m] of SCHEDULE) {
    if (kst.getHours() < h || (kst.getHours() === h && kst.getMinutes() < m)) return `오늘 ${String(h).padStart(2, "0")}:${String(m).padStart(2, "0")}`;
  }
  const [h, m] = SCHEDULE[0];
  return `내일 ${String(h).padStart(2, "0")}:${String(m).padStart(2, "0")}`;
}

function inGroup(a) {
  if (state.group === "all") return true;
  return a.keywords.some((k) => String(state.kwGroup[k]) === state.group);
}

function filtered() {
  const q = $("q").value.trim().toLowerCase();
  const days = Number($("period").value);
  const minKey = days > 0 ? daysAgoKey(days - 1) : null;
  const unreadOnly = $("unread").checked;
  return state.data.articles.filter((a) => {
    if (!inGroup(a)) return false;
    if (state.keywords.size && !a.keywords.some((k) => state.keywords.has(k))) return false;
    if (minKey && dateKey(artDate(a)) < minKey) return false;
    if (unreadOnly && state.read.has(a.id)) return false;
    if (q && !`${a.title} ${a.source} ${a.summary}`.toLowerCase().includes(q)) return false;
    return true;
  });
}

function renderStats() {
  const arts = state.data.articles;
  const today = dateKey(Date.now());
  const week = daysAgoKey(6);
  const inWeek = arts.filter((a) => dateKey(artDate(a)) >= week);
  const tiles = [
    { label: "오늘 보도", value: arts.filter((a) => dateKey(artDate(a)) === today).length },
    { label: "최근 7일", value: inWeek.length },
    ...state.data.groups.map((g, gi) => ({
      label: `${g.name} · 7일`,
      value: inWeek.filter((a) => a.keywords.some((k) => state.kwGroup[k] === gi)).length,
    })),
  ];
  if (state.lastVisit) tiles[0] = { label: "지난 방문 후 새 기사", value: arts.filter(isNew).length, accent: true };
  $("stats").innerHTML = tiles.slice(0, 4).map((t) =>
    `<div class="stat ${t.accent ? "accent" : ""}"><div class="label">${esc(t.label)}</div><div class="value">${t.value}<small>건</small></div></div>`
  ).join("");
}

function renderGroups() {
  const opts = [{ id: "all", name: "전체" }, ...state.data.groups.map((g, i) => ({ id: String(i), name: g.name }))];
  $("groups").innerHTML = opts.map((o) =>
    `<button type="button" data-g="${o.id}" aria-pressed="${state.group === o.id}">${esc(o.name)}</button>`
  ).join("");
}

function renderChips() {
  const counts = {};
  for (const a of state.data.articles) for (const k of a.keywords) counts[k] = (counts[k] || 0) + 1;
  const kws = state.data.groups.flatMap((g, gi) => (state.group === "all" || state.group === String(gi)) ? g.keywords.map((k) => [k, gi]) : []);
  $("chips").innerHTML = kws.map(([k, gi]) =>
    `<button type="button" class="chip" style="${colorVars(gi)}" data-k="${esc(k)}" aria-pressed="${state.keywords.has(k)}">${esc(k)}<span class="n">${counts[k] || 0}</span></button>`
  ).join("");
}

function renderList() {
  const items = filtered();
  const newCount = items.filter(isNew).length;
  $("count").textContent = `기사 ${items.length}건` + (newCount ? ` · 새 기사 ${newCount}건` : "");
  if (!items.length) {
    $("list").innerHTML = `<div class="empty">조건에 맞는 기사가 없습니다.<br>기간을 늘리거나 필터를 해제해 보세요.</div>`;
    return;
  }
  const byDay = new Map();
  for (const a of items) {
    const k = dateKey(artDate(a));
    if (!byDay.has(k)) byDay.set(k, []);
    byDay.get(k).push(a);
  }
  const today = dateKey(Date.now()), yesterday = daysAgoKey(1);
  let html = "";
  for (const [k, arts] of byDay) {
    const rel = k === today ? "오늘" : k === yesterday ? "어제" : "";
    html += `<div class="day"><h2>${rel ? rel + " · " : ""}${fmtDay(artDate(arts[0]))}</h2><span>${arts.length}건</span></div><div class="list">`;
    for (const a of arts) {
      html += `
        <a class="item ${state.read.has(a.id) ? "read" : ""}" href="${esc(a.link)}" target="_blank" rel="noopener" data-id="${esc(a.id)}">
          <div class="title">${isNew(a) ? '<span class="new">NEW</span>' : ""}${esc(a.title)}</div>
          ${a.summary ? `<p class="summary">${esc(a.summary)}</p>` : ""}
          <div class="meta">
            <span class="src">${esc(a.source || "출처 미상")}</span>
            ${a.published ? `<span>${fmtTime(a.published)}</span>` : ""}
            ${a.keywords.map((kw) => `<span class="tag" style="${colorVars(state.kwGroup[kw] ?? 0)}">${esc(kw)}</span>`).join("")}
          </div>
        </a>`;
    }
    html += `</div>`;
  }
  $("list").innerHTML = html;
}

function renderAll() { renderStats(); renderGroups(); renderChips(); renderList(); }

function saveRead() {
  const ids = new Set(state.data.articles.map((a) => a.id));
  store.set("read", [...state.read].filter((x) => ids.has(x)));
}

function toast(msg) {
  const t = $("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(toast.timer); toast.timer = setTimeout(() => t.classList.remove("show"), 1800);
}

// 이벤트
$("groups").addEventListener("click", (e) => {
  const b = e.target.closest("button"); if (!b) return;
  state.group = b.dataset.g; state.keywords.clear(); store.set("group", state.group);
  renderGroups(); renderChips(); renderList();
});
$("chips").addEventListener("click", (e) => {
  const b = e.target.closest(".chip"); if (!b) return;
  const k = b.dataset.k;
  state.keywords.has(k) ? state.keywords.delete(k) : state.keywords.add(k);
  renderChips(); renderList();
});
["q", "period", "unread"].forEach((id) => $(id).addEventListener("input", renderList));
function onOpen(e) {
  const a = e.target.closest("a.item"); if (!a) return;
  state.read.add(a.dataset.id); saveRead();
  a.classList.add("read"); a.querySelector(".new")?.remove();
}
$("list").addEventListener("click", onOpen);
$("list").addEventListener("auxclick", onOpen);
$("markAll").addEventListener("click", () => {
  filtered().forEach((a) => state.read.add(a.id)); saveRead(); renderList();
  toast("표시된 기사를 모두 읽음 처리했습니다");
});
$("share").addEventListener("click", async () => {
  const url = location.href.split("#")[0].split("?")[0];
  try {
    if (navigator.share && matchMedia("(max-width: 720px)").matches) {
      await navigator.share({ title: document.title, url });
      return;
    }
    await navigator.clipboard.writeText(url);
    toast("링크를 복사했습니다. 팀원에게 붙여넣어 공유하세요");
  } catch {
    prompt("아래 링크를 복사하세요", url);
  }
});

// 데이터 불러오기
fetch(`news.json?t=${Date.now()}`)
  .then((r) => r.json())
  .then((data) => {
    if (!data.groups?.length) data.groups = [{ name: "전체", keywords: data.keywords?.length ? data.keywords : [...new Set(data.articles.flatMap((a) => a.keywords))] }];
    data.groups.forEach((g, gi) => g.keywords.forEach((k) => (state.kwGroup[k] = gi)));
    if (state.group !== "all" && !data.groups[Number(state.group)]) state.group = "all";
    state.data = data;
    $("updated").textContent = data.updated ? `${fmtDay(data.updated)} ${fmtTime(data.updated)}` : "아직 없음";
    $("next").textContent = nextUpdateText();
    renderAll();
    // 다음 방문 때 이번 업데이트 이후 수집된 기사에 NEW 표시
    if (data.updated) store.set("lastVisit", data.updated);
  })
  .catch(() => {
    $("updated").textContent = "불러오기 실패";
    $("list").innerHTML = `<div class="empty">뉴스 데이터를 불러오지 못했습니다.<br>잠시 후 새로고침해 주세요.</div>`;
  });
</script>
</body>
</html>
